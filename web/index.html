<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kniffel</title>
  <link data-trunk rel="rust" data-bin="knfsolv-web" data-type="main" data-wasm-opt="0">
  <link data-trunk rel="rust" data-bin="speed-worker" data-type="worker" data-loader-shim data-wasm-opt="0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1b1b;
      color: #dddddd;
      font: 17px -apple-system, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #f8f8f8; color: #222222; }
    }
    /* Keep the canvas clear of the notch and home indicator. */
    #frame {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
    }
    #app { display: block; width: 100%; height: 100%; touch-action: none; }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      white-space: pre-wrap;
      pointer-events: none;
    }
    #status.visible { background: inherit; pointer-events: auto; -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div id="frame"><canvas id="app"></canvas></div>
  <div id="status">Kniffel lädt …</div>
</body>
</html>
