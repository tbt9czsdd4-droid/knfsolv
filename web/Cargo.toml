[package]
name = "knfsolv-web"
version = "0.1.0"
edition = "2024"
description = "Browser entry point for the Kniffel interface"
license = "MIT"
publish = false

# Build with Trunk (see index.html); native builds only run the speed comparison.
[dependencies]
knfsolv = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "console",
    "DedicatedWorkerGlobalScope",
    "Document",
    "DomRect",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FilePropertyBag",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "MouseEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "ShareData",
    "Storage",
    "StorageManager",
    "Touch",
    "TouchEvent",
    "TouchList",
    "UiEvent",
    "Url",
    "Window",
    "Worker",
] }
